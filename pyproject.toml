[project]
name = "production-rag-backend"
version = "0.1.0"
description = "Production-style RAG backend with FastAPI, Postgres pgvector, retrieval, generation, and observability"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.24.0",
    "openai>=1.35.0",
    "google-generativeai>=0.7.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "sentence-transformers>=5.6.0",
    "groq",
    "langchain-text-splitters",
    "langchain-community",
    "langchain-huggingface",
    "langchain-core",
    "langchain-groq>=1.1.3",
    "streamlit>=1.59.2",
    "requests>=2.34.2",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "docling[rapidocr]>=2.121.0",
    "pytesseract>=0.3.13",
    "rank-bm25>=0.2.2",
    "langsmith>=0.10.3",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "xlutils>=2.0.0",
    "xlrd>=2.0.1",
    "xlwt>=1.3.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "PyJWT>=2.8.0",
    "firecrawl-py>=4.44.0",
    "langgraph>=1.2.12",
    "paddleocr>=2.10.0",
    "paddlepaddle>=3.3.1",
    "fastmcp>=4.0.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
